<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reyhan Alpboğa | Frontend Geliştirici Portfolyosu</title>
  <meta name="description" content="Reyhan Alpboğa'nın frontend geliştirme portfolyosu. Web geliştirme projelerini, teknik yeteneklerini ve eğitimlerini keşfedin.">
  <meta name="author" content="Reyhan Alpboğa">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Reyhan Alpboğa | Frontend Geliştirici Portfolyosu">
  <meta property="og:description" content="Web geliştirme projelerimi, teknik yeteneklerimi ve eğitimlerimi keşfedin.">

  <meta name="theme-color" content="#f3f4f6">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>

<body class="bg-light text-dark p-3 p-md-5">

  <main class="container portfolio-container">

    <!-- DİNAMİK NAVBAR -->
    <div id="navbar-container"></div>

    <!-- 1. PROFİL SEKMESİ -->
    <div id="profil" class="tab-content">
      <div id="hero-container"></div>
    </div>

    <!-- 2. TEKNİK YETENEKLER SEKMESİ -->
    <div id="yetenekler" class="tab-content hidden">
      <section class="card p-4 shadow-sm">
        <h2 class="h5 fw-bold mb-3 border-bottom pb-2">Teknik Yetenekler (Modüler JS)</h2>
        <div id="skills-container" class="d-flex flex-column gap-2"></div>
      </section>
    </div>

    <!-- 3. STAJ İLERLEMESİ SEKMESİ -->
    <div id="ilerleme" class="tab-content hidden">
      <section class="card p-4 shadow-sm">
        <h2 class="h5 fw-bold mb-3 border-bottom pb-2">Staj İlerlemesi</h2>
        <p class="small text-muted mb-3">
          Modüler bileşen yapısı ve ES6 modülleri başarıyla uygulandı.
        </p>
        <div class="alert alert-info mb-0 small">
          <strong>Hedef:</strong> Temiz kod (Clean Code) standartlarında kusursuz bir portfolyo sunmak.
        </div>
      </section>
    </div>

    <!-- 4. EĞİTİMLER SEKMESİ -->
    <div id="egitimler" class="tab-content hidden">
      <section class="card p-4 shadow-sm">
        <h2 class="h5 fw-bold mb-3 border-bottom pb-2">Tamamlanan Eğitimler & Programlar</h2>
        <div id="courses-container" class="d-flex flex-column gap-2"></div>
      </section>
    </div>

    <!-- 5. İLETİŞİM SEKMESİ -->
    <div id="iletisim" class="tab-content hidden">
      <section class="card p-4 shadow-sm">
        <h2 class="h5 fw-bold mb-3 border-bottom pb-2">İletişime Geç</h2>
        <form id="contactForm" class="d-flex flex-column gap-3">
          <div>
            <label for="contactName" class="form-label small fw-semibold">Adınız</label>
            <input id="contactName" name="name" type="text" class="form-control" placeholder="Adınızı girin" autocomplete="name" required>
          </div>
          <div>
            <label for="contactEmail" class="form-label small fw-semibold">E-posta</label>
            <input id="contactEmail" name="email" type="email" class="form-control" placeholder="ornek@mail.com" autocomplete="email" required>
          </div>
          <button type="submit" class="btn btn-primary align-self-start">Gönder</button>
        </form>
      </section>
    </div>

  </main>

  <!-- DİNAMİK FOOTER -->
  <div id="footer-container"></div>

  <!-- JavaScript Modül Bağlantısı -->
  <script type="module" src="./js/script.js"></script>
</body>
</html>
